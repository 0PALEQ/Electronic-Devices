plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:G922NeHS:7aLfBD61" // WATERMeDIA 3.0.0 compatibility API
    include(modImplementation("me.lucko:fabric-permissions-api:0.6.1") {
        transitive = false
    })

    // WATERMeDIA stays reflection-only in WaterMediaBridge, so it is never compiled
    // against directly; these are dev-workspace-only runtime dependencies (not bundled
    // or published) so `runClient`/`runServer` can exercise real TV video playback.
    modLocalRuntime "maven.modrinth:G922NeHS:7aLfBD61" // WATERMeDIA 3.0.0
    modLocalRuntime "maven.modrinth:4997XcoK:IvgVb1Pv" // WATERMeDIA Binaries 3.0.0
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            loader_version: project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

sourceSets.main.resources.srcDir rootProject.file('../../shared/src/main/resources')
sourceSets.main.java.srcDir rootProject.file('../../shared/src/main/java')
