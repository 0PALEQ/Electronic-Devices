plugins {
    id 'dev.architectury.loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    compileOnly "maven.modrinth:G922NeHS:7aLfBD61" // WATERMeDIA 3.0.0 compatibility API

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    forge {
    }

    runs {
        client {
            client()
            name = 'Forge Client'
			runDir 'run-client'
        }
        server {
            server()
            name = 'Forge Server'
			runDir 'run-server'
            programArgs '--nogui'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'forge_version', project.forge_version

    filesMatching('META-INF/mods.toml') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            forge_version: project.forge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

test {
    useJUnitPlatform()
}

def verifyNoWaterMediaSplitPackage = tasks.register('verifyNoWaterMediaSplitPackage') {
    dependsOn tasks.named('classes')
    doLast {
        def foreignClasses = fileTree(layout.buildDirectory.dir('classes/java/main').get().asFile) {
            include 'org/watermedia/**'
        }.files
        if (!foreignClasses.empty) {
            throw new GradleException('EDM must not package classes in org.watermedia; Forge rejects split Java-module packages.')
        }
    }
}

tasks.named('check') {
    dependsOn verifyNoWaterMediaSplitPackage
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

sourceSets.main.resources.srcDir rootProject.file('../../shared/src/main/resources')
sourceSets.main.java.srcDir rootProject.file('../../shared/src/main/java')
